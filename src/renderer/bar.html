<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;" />
    <title>Claude Usage</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="bar.css" />
  </head>
  <body>
    <div class="panel" id="panel">
      <div class="status" id="status" title="Connection">
        <span class="dot"></span>
      </div>

      <div class="body">
        <!-- Live readings -->
        <div class="meters" id="meters">
          <div class="row" data-meter="session" data-long="SESSION" data-short="5H">
            <span class="label">SESSION</span>
            <div class="meter"><div class="fill"></div></div>
            <span class="pct">--</span>
            <span class="time">--</span>
          </div>

          <div class="row" data-meter="week" data-long="WEEK" data-short="7D">
            <span class="label">WEEK</span>
            <div class="meter"><div class="fill"></div></div>
            <span class="pct">--</span>
            <span class="time">--</span>
          </div>

          <div class="row" data-meter="scoped" data-long="MODEL" data-short="MDL" hidden>
            <span class="label">MODEL</span>
            <div class="meter"><div class="fill"></div></div>
            <span class="pct">--</span>
            <span class="time">--</span>
          </div>

          <div class="row" data-meter="credit" data-long="CREDIT" data-short="CRD" hidden>
            <span class="label">CREDIT</span>
            <div class="meter"><div class="fill"></div></div>
            <span class="pct">--</span>
            <span class="time">--</span>
          </div>
        </div>

        <!-- Takes over the bar when there is nothing trustworthy to show -->
        <div class="notice" id="notice" hidden>
          <div class="notice-text">
            <span class="notice-title" id="noticeTitle">No connection</span>
            <span class="notice-detail" id="noticeDetail"></span>
          </div>
          <button class="retry" id="retry" type="button">Retry</button>
        </div>

        <!--
          One strip answers two questions that share a home: when the numbers
          were last refreshed, and whether they are still being refreshed at all.
        -->
        <div class="strip" id="strip">
          <span class="strip-state" id="stripState">Checking…</span>
          <span class="strip-right">
            <button class="strip-retry" id="stripRetry" type="button" hidden>Retry</button>
            <span class="strip-plan" id="stripPlan"></span>
          </span>
        </div>
      </div>

      <div class="actions">
        <button class="icon-btn" id="refreshBtn" type="button" title="Refresh now" aria-label="Refresh now">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.2V5h-2.8" />
          </svg>
        </button>
        <button class="icon-btn" id="settingsBtn" type="button" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="2.1" />
            <path d="M8 1.6v1.5M8 12.9v1.5M14.4 8h-1.5M3.1 8H1.6M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1M12.5 12.5l-1.1-1.1M4.6 4.6L3.5 3.5" />
          </svg>
        </button>
        <button class="icon-btn" id="hideBtn" type="button" title="Hide widget" aria-label="Hide widget">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4 4l8 8M12 4l-8 8" />
          </svg>
        </button>
      </div>
    </div>

    <script src="bar.js"></script>
  </body>
</html>
