<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../src/renderer/tokens.css" />
    <style>
      /*
       * The README poster. Built from the app's own tokens so the banner and the
       * product cannot drift apart, and rendered through Electron so the type is
       * real type rather than plotted pixels.
       */
      body {
        width: 1280px;
        height: 640px;
        display: grid;
        grid-template-columns: 1fr 470px;
        align-items: center;
        gap: 64px;
        padding: 0 76px;
        background: var(--ink);
        overflow: hidden;
      }

      /* A faint redline arc bleeding off the right edge — the product's own idea, enlarged */
      body::after {
        content: '';
        position: absolute;
        top: -190px;
        right: -300px;
        width: 780px;
        height: 780px;
        border: 76px solid var(--redline);
        border-radius: 50%;
        clip-path: inset(0 0 42% 0);
      }

      .left {
        position: relative;
        z-index: 1;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 11px;
        font-family: var(--mono);
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--calm);
        margin-bottom: 30px;
      }

      .eyebrow::after {
        content: '';
        width: 92px;
        height: 1px;
        background: color-mix(in srgb, var(--calm) 45%, transparent);
      }

      h1 {
        margin: 0 0 22px;
        font-family: var(--mono);
        font-size: 76px;
        font-weight: 600;
        line-height: 0.98;
        letter-spacing: -0.035em;
        color: var(--text);
      }

      h1 em {
        display: block;
        font-style: normal;
        color: var(--text-faint);
      }

      p {
        margin: 0 0 38px;
        max-width: 480px;
        font-family: var(--ui);
        font-size: 20px;
        line-height: 1.55;
        color: var(--text-dim);
      }

      .facts {
        display: flex;
        gap: 12px;
      }

      .fact {
        padding: 9px 15px;
        font-family: var(--mono);
        font-size: 13px;
        letter-spacing: 0.06em;
        color: var(--text-dim);
        border: 1px solid var(--line-strong);
        border-radius: 7px;
      }

      /* ---- the widget itself, drawn at 1.5x so it reads in a thumbnail ---- */

      .bar {
        position: relative;
        z-index: 1;
        padding: 17px 18px 15px;
        background: var(--ink-raised);
        border: 1px solid var(--line-strong);
        border-radius: 16px;
        box-shadow: inset 0 1px 0 var(--highlight), 0 44px 90px rgba(0, 0, 0, 0.6);
      }

      .row {
        display: grid;
        grid-template-columns: 84px 1fr 48px 82px;
        align-items: center;
        gap: 13px;
        height: 29px;
      }

      .label {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.13em;
        color: var(--text-faint);
      }

      .meter {
        position: relative;
        height: 9px;
        border-radius: 1px;
        background:
          repeating-linear-gradient(90deg, var(--track) 0 3.6%, transparent 3.6% 5%),
          linear-gradient(90deg, transparent 0 85%, var(--redline) 85% 100%);
      }

      .fill {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(90deg, var(--c) 0 3.6%, transparent 3.6% 5%);
        clip-path: inset(0 var(--empty) 0 0);
      }

      .pct {
        font-family: var(--mono);
        font-size: 18px;
        font-weight: 600;
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }

      .time {
        font-family: var(--mono);
        font-size: 15px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: var(--text-dim);
      }

      .strip {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 12px;
        padding-top: 11px;
        border-top: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 13px;
        letter-spacing: 0.05em;
        color: var(--text-faint);
      }

      .plan {
        font-weight: 600;
        letter-spacing: 0.18em;
      }

      /* ---- notch mode, shown as a detail crop of the middle of the menu bar ---- */

      .showcase {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 30px;
      }

      /*
       * Not a whole display: the notch is 184pt of a 1512pt screen, and drawn to
       * that ratio it would be too small to show the meter at all. So this is a
       * close-up of the middle of the menu bar, faded off at both sides to say so.
       * The middle of a real menu bar is empty, which is why nothing else is in it.
       */
      .notch-demo {
        position: relative;
        height: 112px;

        /* A desktop, lit well clear of the poster's own ink — the housing is pure
           black and has to read as a hole in the screen rather than more background. */
        background:
          radial-gradient(90% 130% at 50% 8%, rgba(217, 119, 87, 0.3), transparent 60%),
          linear-gradient(165deg, #7d5442, #402e25 58%, #291e19);
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent);
        mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent);
      }

      /* The strip the housing interrupts — 33pt tall on a notched Mac, at the same
         1.5x as the bar above it. */
      .menubar {
        height: 50px;
        background: rgba(0, 0, 0, 0.3);
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }

      /*
       * The camera housing plus the 14pt the widget adds to it. One silhouette:
       * pure black, square sides, a single rounded bottom edge — the thing the app
       * goes to some trouble to be indistinguishable from.
       */
      .notch {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: flex-end;
        width: 276px;
        height: 71px;
        padding: 0 12px 9px;
        background: #000;
        border-radius: 0 0 16px 16px;
      }

      .notch .meter {
        flex: 1;
        height: 4.5px;
        border-radius: 0; /* square ends, as in the app — rounding eats the outer ticks */
      }

      .caption {
        display: flex;
        align-items: center;
        gap: 13px;
        margin-top: -12px;
        font-family: var(--mono);
        font-size: 13px;
        letter-spacing: 0.05em;
        white-space: nowrap;
        color: var(--text-faint);
      }

      .caption b {
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--calm);
      }

      .caption::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--line);
      }
    </style>
  </head>
  <body>
    <div class="left">
      <div class="eyebrow">Claude Code</div>
      <h1>Usage<em>at a glance</em></h1>
      <p>
        A floating bar that shows how much of your Claude subscription is left, and how
        long until it resets.
      </p>
      <div class="facts">
        <span class="fact">Windows &amp; macOS</span>
        <span class="fact">Notch mode</span>
        <span class="fact">No extra login</span>
        <span class="fact">MIT</span>
      </div>
    </div>

    <div class="showcase">
    <div class="bar">
      <div class="row" style="--c: var(--calm)">
        <span class="label">SESSION</span>
        <div class="meter"><div class="fill" style="--empty: 80%"></div></div>
        <span class="pct">20%</span>
        <span class="time">1h 40m</span>
      </div>
      <div class="row" style="--c: var(--warn)">
        <span class="label">WEEK</span>
        <div class="meter"><div class="fill" style="--empty: 32%"></div></div>
        <span class="pct">68%</span>
        <span class="time">5d 18h</span>
      </div>
      <div class="row" style="--c: var(--alarm)">
        <span class="label">OPUS</span>
        <div class="meter"><div class="fill" style="--empty: 9%"></div></div>
        <span class="pct">91%</span>
        <span class="time">2d 04h</span>
      </div>
      <div class="strip">
        <span>Updated just now</span>
        <span class="plan">MAX</span>
      </div>
      </div>

      <div class="caption"><b>Notch mode</b><span>the meter, inside the housing</span></div>
      <div class="notch-demo" style="--c: var(--calm)">
        <div class="menubar"></div>
        <div class="notch">
          <div class="meter"><div class="fill" style="--empty: 80%"></div></div>
        </div>
      </div>
    </div>
  </body>
</html>
